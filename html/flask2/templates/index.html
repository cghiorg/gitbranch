<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <title>Registro</title>

</head>

<body>

<h1>Datos personales</h1>

<form action="/procesar" method="POST">

    <label>Nombre</label>

    <input
        type="text"
        name="nombre"
        required
    >

    <br><br>

    <label>Edad</label>

    <input
        type="number"
        name="edad"
        required
    >

    <br><br>

    <button type="submit">
        Procesar
    </button>

</form>

</body>

</html>
